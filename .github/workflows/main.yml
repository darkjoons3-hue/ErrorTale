name: Build ErrorTale

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pygame
          pip install pyinstaller
          
      - name: Build EXE
        run: pyinstaller --name ErrorTale --onefile --windowed --add-data "logo.png;." --add-data "background-up.png;." --add-data "background-down.png;." --add-data "DeterminationMono.ttf;." --add-data "undertale-logo1.mp3;." --add-data "undertale-logo2.mp3;." --add-data "MainTheme.mp3;." --add-data "select.mp3;." main.py
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ErrorTale-Windows
          path: dist/ErrorTale.exe
